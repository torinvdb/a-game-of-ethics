# Copy to .github/workflows/ in your repository.
# Evaluates hosted models with API keys stored in a protected environment.
# Create the environment (Settings > Environments > evals), add the secrets
# there and require a reviewer, so every live run is approved by a person.
name: Ethics eval (models)

on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [smoke, pilot]
        default: smoke
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: agoe-models
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: evals
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: anthropic
            models: claude-haiku-5-5
          - provider: openai-compatible
            models: openai/gpt-5-mini
            # openai-compatible models must be priced in the config, so this
            # entry points at a config in your repository.
            config: evals/openrouter-config.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run A Game of Ethics
        uses: torinvdb/a-game-of-ethics@v2 # pin a full commit SHA in production
        with:
          provider: ${{ matrix.provider }}
          models: ${{ matrix.models }}
          config: ${{ matrix.config || 'benchmark/experiments/e1-anthropic/config.json' }}
          scenarios: hostage-holdout
          stage: ${{ inputs.stage || 'smoke' }}
          budget-usd: '2'
          fail-on: failure-rate>0.2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
