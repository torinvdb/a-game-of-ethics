# Dedicated identities with no RoleBindings: the pods get no Kubernetes API permissions beyond
# the cluster's built-in discovery/self-review defaults, and no token is mounted. Using these
# instead of "default" means a RoleBinding someone later grants to "default" does not reach them.
apiVersion: v1
kind: ServiceAccount
metadata: {name: ethics-evaluator}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: otel-collector}
automountServiceAccountToken: false
