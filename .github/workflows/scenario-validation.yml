name: Scenario Validation

on:
  push:
    paths:
      - 'scenarios/**/*.ink'
      - 'src/debug.js'
      - 'src/lib/ink.js'
  pull_request:
    paths:
      - 'scenarios/**/*.ink'

permissions:
  contents: read

jobs:
  validate-scenarios:
    name: Validate Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Scenarios are compiled with the inkjs compiler from package.json, so no
      # inklecate binary download is needed. debug.js exits non-zero on errors.
      - name: Validate core scenarios and templates
        id: validate
        run: node src/debug.js --auto-validate scenarios/core/*.ink scenarios/tmpl/*.ink

      # The generated gpt-oss-20b scenarios currently fail the structural lint
      # (they compile, but miss authoring conventions). Report without blocking.
      - name: Lint generated scenarios (non-blocking)
        continue-on-error: true
        run: node src/debug.js --auto-validate scenarios/gpt-oss-20b/*.ink

      - name: Create summary
        if: always()
        env:
          OUTCOME: ${{ steps.validate.outcome }}
        run: |
          echo "## Scenario Validation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = 'success' ]; then
            echo "All scenarios pass validation (or have only warnings)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Some scenarios failed validation. Check the job log for details." >> "$GITHUB_STEP_SUMMARY"
          fi
